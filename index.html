<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gil Proyect - Recursos Educativos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Orbitron', monospace;
            background-color: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0a0a0a, #1a1a1a, #0a0a0a);
            z-index: -2;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .title {
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 2rem;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #aaa, 0 0 40px #aaa, 0 0 50px #888, 0 0 60px #888, 0 0 70px #666;
            animation: neon-flicker 1.5s infinite alternate;
            letter-spacing: 0.1em;
        }
        
        @keyframes neon-flicker {
            0%, 100% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #aaa, 0 0 40px #aaa, 0 0 50px #888, 0 0 60px #888, 0 0 70px #666; }
            50% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #aaa, 0 0 20px #aaa, 0 0 25px #888, 0 0 30px #888, 0 0 35px #666; }
        }
        
        .enter-btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
            z-index: 1;
            margin-bottom: 2rem;
        }
        
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #fff, #888);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        
        .enter-btn:hover::before {
            transform: scaleX(1);
        }
        
        .enter-btn:hover {
            color: #0a0a0a;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #aaa;
        }
        
        .content {
            display: none;
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 1s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        nav {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 25px;
            margin: 0 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .nav-btn:hover, .nav-btn.active {
            background: #fff;
            color: #0a0a0a;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        
        .section {
            display: none;
            padding: 20px;
            background: rgba(10, 10, 10, 0.7);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 2rem;
        }
        
        .section.active {
            display: block;
            animation: sectionFadeIn 0.5s ease;
        }
        
        @keyframes sectionFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 250px;
